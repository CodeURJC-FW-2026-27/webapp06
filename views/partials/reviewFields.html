{{! Fields of the review form. Used by playerDetail.html (create) and reviewForm.html (edit).
    Context: review {nickname, review_date, opinion, rating} (empty when creating),
    ratings [{value, label, selected}], limits (REVIEW_LIMITS) and today (YYYY-MM-DD). }}
<div class="row g-3 mb-3">
    <div class="col-md-6">
        <label for="nickname" class="form-label">Nombre de usuario:</label>
        <input type="text" class="form-control" id="nickname" name="nickname"
            placeholder="Nombre de usuario" value="{{review.nickname}}"
            minlength="{{limits.NICKNAME_MIN}}" maxlength="{{limits.NICKNAME_MAX}}" required />
    </div>
    <div class="col-md-3">
        <label for="review_date" class="form-label">Fecha de la reseña:</label>
        <input type="date" class="form-control" id="review_date" name="review_date"
            value="{{review.review_date}}" max="{{today}}" required />
    </div>
    <div class="col-md-3">
        <label for="rating" class="form-label">Puntuación:</label>
        <select class="form-select" id="rating" name="rating" required>
            <option value="" disabled {{^review.rating}}selected{{/review.rating}}>Selecciona</option>
            {{#ratings}}
            <option value="{{value}}" {{#selected}}selected{{/selected}}>{{label}}</option>
            {{/ratings}}
        </select>
    </div>
</div>
<div class="mb-3">
    <label for="opinion" class="form-label">Opinión:</label>
    <textarea class="form-control" id="opinion" name="opinion" rows="3"
        placeholder="Escribe tu opinión" minlength="{{limits.OPINION_MIN}}"
        maxlength="{{limits.OPINION_MAX}}" required>{{review.opinion}}</textarea>
</div>
