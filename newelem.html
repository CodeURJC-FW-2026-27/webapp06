<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Crear Jugador - Shop Homepage</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/searchbar.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Header-->
    <header class="bg-dark py-4">
        <div class="container px-4 px-lg-5 my-3">
            <div class="header-content text-white">
                <a href="index.html" class="header-brand text-white text-decoration-none">
                    <h1 class="display-4 fw-bolder">LEAGUES MARKET</h1>
                </a>
                <div class="header-tools">
                    <form action="/search" method="GET" class="d-flex justify-content-end">
                        <div class="input-group search-container">
                            <input type="search" name="query" class="form-control search-input"
                                placeholder="Buscar jugadores, equipos..." aria-label="Buscar">
                            <button class="btn btn-primary search-btn" type="submit">Buscar</button>
                        </div>
                    </form>
                    <div class="category-list mt-4 d-flex justify-content-start flex-wrap align-items-center gap-2">
                        <span class="category-label text-white-50 me-1">Categorías:</span>
                        <button type="button" class="btn btn-light btn-sm category-badge">Todas</button>
                        <button type="button" class="btn btn-outline-light btn-sm category-badge">Porteros</button>
                        <button type="button" class="btn btn-outline-light btn-sm category-badge">Defensas</button>
                        <button type="button" class="btn btn-outline-light btn-sm category-badge">Centrocampistas</button>
                        <button type="button" class="btn btn-outline-light btn-sm category-badge">Delanteros</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-header bg-dark text-white">
                            <h2 class="h4 mb-0">Crear Nuevo Jugador</h2>
                        </div>
                        <div class="card-body">
                            <form class="form" action="#" method="POST" enctype="multipart/form-data">
                                <!-- Nombre del jugador -->
                                <div class="mb-3">
                                    <label for="player_name" class="form-label">Nombre del jugador:</label>
                                    <input type="text" class="form-control" id="player_name" name="player_name"
                                        placeholder="Nombre del jugador" required />
                                </div>

                                <!-- Fecha de nacimiento -->
                                <div class="mb-3">
                                    <label for="date_of_birth" class="form-label">Fecha de nacimiento:</label>
                                    <input type="date" class="form-control" id="date_of_birth" name="date_of_birth"
                                        required />
                                </div>

                                <!-- Equipo del jugador -->
                                <div class="mb-3">
                                    <label for="player_team" class="form-label">Equipo del jugador:</label>
                                    <input type="text" class="form-control" id="player_team" name="player_team"
                                        placeholder="Equipo del jugador" required />
                                </div>

                                <!-- Posición del jugador -->
                                <div class="mb-3">
                                    <label for="position" class="form-label">Posición del jugador:</label>
                                    <input type="text" class="form-control" id="position" name="position"
                                        placeholder="Posición" required />
                                </div>

                                <!-- Liga -->
                                <div class="mb-3">
                                    <label for="league" class="form-label">Liga:</label>
                                    <input type="text" class="form-control" id="league" name="league" placeholder="Liga"
                                        required />
                                </div>

                                <!-- Descripción del jugador -->
                                <div class="mb-3">
                                    <label for="description" class="form-label">Descripción del jugador:</label>
                                    <textarea class="form-control" id="description" name="description" rows="3"
                                        placeholder="Escribe una descripción del jugador" required></textarea>
                                </div>

                                <!-- Imagen del jugador -->
                                <div class="mb-3">
                                    <label for="player_image" class="form-label">Imagen del jugador:</label>
                                    <input type="file" class="form-control" id="player_image" name="player_image"
                                        accept="image/*" required />
                                </div>

                                <div class="mb-3">
                                    <label for="photographer" class="form-label">Fotógrafo:</label>
                                    <input type="text" class="form-control" id="photographer" name="photographer"
                                        placeholder="Nombre del fotógrafo" required />
                                </div>

                                <!-- Precio -->
                                <div class="mb-3">
                                    <label for="price" class="form-label">Precio:</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" class="form-control" id="price" name="price"
                                            placeholder="Precio" step="1" min="0" required />
                                    </div>
                                </div>

                                <!-- Botones -->

                                <div class="d-flex gap-2">
                                    <a href="index.html" class="btn btn-danger">
                                        <i class="bi bi-x-circle me-1"></i> Cancelar
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-save me-1"></i> Guardar
                                    </button>



                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer-->
    <footer class="py-5 bg-dark mt-auto">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; LEAGUES MARKET-06 2026</p>
        </div>
    </footer>

    <!-- Bootstrap core JS (opcional, para componentes interactivos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
