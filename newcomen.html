<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Formulario para crear un nuevo comentario" />
    <meta name="author" content="Grupo 06" />
    <title>LEAGUES MARKET - Crear comentario</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/searchbar.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
    
    <!-- Header-->
    <header class="bg-dark py-4">
        <div class="container px-4 px-lg-5 my-3">
            <div class="header-content text-white">
                <a href="index.html" class="header-brand text-white text-decoration-none">
                    <h1 class="display-4 fw-bolder">LEAGUES MARKET</h1>
                </a>
                <div class="header-tools">
                    <form action="/search" method="GET" class="d-flex justify-content-end">
                        <div class="input-group search-container">
                            <input type="search" name="query" class="form-control search-input"
                                placeholder="Buscar jugadores, equipos..." aria-label="Buscar">
                            <button class="btn btn-primary search-btn" type="submit">Buscar</button>
                        </div>
                    </form>
                    <div class="category-list mt-4 d-flex flex-wrap align-items-center gap-2">
                        <span class="category-label text-white-50 me-1">Categorías:</span>
                        <button type="button" class="btn btn-light btn-sm category-badge">Todas</button>
                        <button type="button" class="btn btn-outline-light btn-sm category-badge">Porteros</button>
                        <button type="button" class="btn btn-outline-light btn-sm category-badge">Defensas</button>
                        <button type="button"
                            class="btn btn-outline-light btn-sm category-badge">Centrocampistas</button>
                        <button type="button" class="btn btn-outline-light btn-sm category-badge">Delanteros</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Principal Content -->
    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-header bg-dark text-white">
                            <h4 class=" mb-0">Crear Nuevo Comentario</h4>
                        </div>
                        <div class="card-body">
                            <form class="form" action="detalle.html" method="GET">
                                <!-- User Nickname -->
                                <div class="mb-3">
                                    <label for="user_nickname" class="form-label">Nombre de usuario:</label>
                                    <input type="text" class="form-control" id="user_nickname" name="user_nickname"
                                        placeholder="Nombre de usuario" required />
                                </div>

                                <!-- Review Date -->
                                <div class="mb-3">
                                    <label for="review_date" class="form-label">Fecha de la reseña:</label>
                                    <input type="date" class="form-control" id="review_date" name="review_date"
                                        required />
                                </div>

                                <!-- Review -->
                                <div class="mb-3">
                                    <label for="review" class="form-label">Reseña:</label>
                                    <textarea class="form-control" id="review" name="review" rows="3"
                                        placeholder="Escribe una reseña" required></textarea>
                                </div>

                                <!-- Rating -->
                                <div class="mb-3">
                                    <label for="rating" class="form-label">Puntuación:</label>
                                    <select class="form-select" id="rating" name="rating" required>
                                        <option value="" disabled selected>Selecciona una puntuación</option>
                                        <option value="1">1 - Mala</option>
                                        <option value="2">2 - Regular</option>
                                        <option value="3">3 - Buena</option>
                                        <option value="4">4 - Muy buena</option>
                                        <option value="5">5 - Excelente</option>
                                    </select>
                                </div>

                                <!-- Buttons -->

                                <div class="d-flex gap-2">
                                    <a href="detalle.html" class="btn btn-danger">
                                        <i class="bi bi-x-circle me-1"></i> Cancelar
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-save me-1"></i> Guardar
                                    </button>




                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer-->
    <footer class="py-5 bg-dark mt-auto">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; LEAGUES MARKET-06 2026</p>
        </div>
    </footer>

    <!-- Bootstrap core JS (opcional, para componentes interactivos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
