<!DOCTYPE html>
<html lang="es">

<head>
    {{> head}}
    <title>LEAGUES MARKET - {{title}}</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
    {{> header}}

    {{! Confirmation page shown after adding, editing or deleting a player or a review.
        Context: title, message, backUrl, backLabel. }}
    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0"><i class="bi bi-check-circle me-2"></i>{{title}}</h4>
                        </div>
                        <div class="card-body">
                            <p>{{message}}</p>
                            <a href="{{backUrl}}" class="btn btn-outline-dark">
                                <i class="bi bi-arrow-left me-1"></i> {{backLabel}}
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    {{> footer}}
</body>

</html>
